<style>
  .flowline-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}.flowline-nav,.flowline-tools{display:flex;align-items:center;gap:8px}.flowline-toggle{display:flex;padding:3px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}.flowline-toggle button{border:0;background:transparent;color:var(--text-muted);padding:6px 12px;border-radius:9px;cursor:pointer;font-weight:750}.flowline-toggle button.active{background:var(--accent);color:#fff}.flowline-canvas{min-height:100%;padding:22px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 3%,var(--bg)) 0,var(--bg) 220px)}
  .flowline-day-shell{display:grid;grid-template-columns:minmax(0,3fr) minmax(260px,1fr);gap:22px;max-width:1260px;margin:0 auto}.flowline-timeline{position:relative;display:flex;flex-direction:column;gap:14px}.flowline-timeline:before{content:"";position:absolute;left:52px;top:18px;bottom:18px;width:2px;background:var(--border)}.flowline-card{display:grid;grid-template-columns:105px 1fr;position:relative;min-width:0}.flowline-marker{z-index:1;align-self:start;margin-top:14px;width:82px;padding:7px 6px;border-radius:12px;background:var(--class-colour);color:#fff;display:flex;flex-direction:column;text-align:center;box-shadow:var(--shadow-sm)}.flowline-marker span{font-weight:850}.flowline-marker small{opacity:.82}.flowline-card-main{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-sm);overflow:hidden;min-width:0}.flowline-card-head{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-left:5px solid var(--class-colour);background:color-mix(in srgb,var(--class-colour) 7%,var(--card))}.flowline-card-head div{display:flex;flex-direction:column}.flowline-card-head small{color:var(--text-muted);margin-top:2px}.flowline-more{border:0;background:transparent;color:var(--text-muted);cursor:pointer}.flowline-actions{display:flex;gap:5px;flex-wrap:wrap;padding:7px 10px;border-bottom:1px solid var(--border)}.flowline-actions button{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:7px;padding:4px 7px;font-size:.75rem;cursor:pointer}.flowline-editor,.flowline-note-editor,.flowline-week-note{outline:none;line-height:1.55}.flowline-editor{min-height:135px;padding:12px}.flowline-editor:empty:before,.flowline-note-editor:empty:before,.flowline-week-note:empty:before{content:attr(data-placeholder);color:var(--text-muted);pointer-events:none}.flowline-save-state{font-size:.72rem;color:var(--text-muted);padding:5px 12px;border-top:1px solid var(--border);text-align:right}.flowline-save-state[data-state="offline"]{font-weight:700}.flowline-daily-rail{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;height:max-content;position:sticky;top:80px}.flowline-rail-head{display:flex;justify-content:space-between;align-items:center;font-weight:850;margin-bottom:10px}.flowline-note-editor{min-height:240px;border-radius:11px;padding:11px;background:#fef08a!important;color:#422006;border:1px solid #eab308}.flowline-note-help{font-size:.75rem;color:var(--text-muted);margin-top:9px}.week-chip{font-size:.7rem;padding:4px 7px;border-radius:999px;background:var(--accent);color:#fff;font-weight:850}
  .flowline-week-board{display:grid;grid-template-columns:repeat(5, 1fr);gap:12px;min-width:1100px}.flowline-week-column{display:flex;flex-direction:column;gap:9px;min-width:0}.flowline-day-track{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-radius:12px;background:var(--card);border-top:4px solid var(--accent);box-shadow:var(--shadow-sm)}.flowline-day-track div{display:flex;flex-direction:column}.flowline-day-track span{color:var(--text-muted);font-size:.75rem}.flowline-week-column .flowline-card{display:block}.flowline-week-column .flowline-marker{display:none}.flowline-week-column .flowline-card-main{border-radius:11px;border:1px solid var(--border);background:var(--card);box-shadow:0 3px 10px rgba(15,23,42,.12)}.flowline-week-column .flowline-card-head{padding:8px 9px;font-size:.83rem}.flowline-week-column .flowline-actions{padding:5px}.flowline-week-column .flowline-actions button{font-size:.66rem;padding:3px 5px}.flowline-week-column .flowline-editor{min-height:115px;padding:8px;font-size:.82rem}.flowline-week-column .flowline-save-state{font-size:.63rem;padding:3px 7px}.flowline-week-note{min-height:80px;padding:9px;border:1px solid color-mix(in srgb,#eab308 35%,var(--border));background:#fef08a!important;color:#422006;border-radius:10px;font-size:.82rem}.flowline-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;min-height:110px;padding:18px;border:1px dashed var(--border);border-radius:12px;color:var(--text-muted);background:var(--card)}.flowline-empty strong{color:var(--text)}.flowline-empty span{font-size:.78rem}.flowline-week-column.is-holiday{opacity:.72}@media(max-width:900px){.flowline-toolbar{align-items:flex-start;flex-wrap:wrap}.flowline-day-shell{grid-template-columns:1fr}.flowline-daily-rail{position:static}.flowline-canvas{padding:12px}.flowline-card{grid-template-columns:86px 1fr}.flowline-timeline:before{left:42px}.flowline-marker{width:68px}}
  @media print{#sidebar,.flowline-toolbar,.flowline-actions,.flowline-save-state,.mobile-menu-btn{display:none!important}.main-content{margin:0!important}.flowline-canvas{padding:0;background:#fff}.flowline-card-main,.flowline-daily-rail,.flowline-day-track{box-shadow:none}}
</style>
<div class="flowline-toolbar">
  <div class="flowline-nav"><button type="button" class="mobile-menu-btn" onclick="app.toggleMenu()"><i class="fas fa-bars"></i></button><button class="btn-outline" onclick="planbookController.navigate(-1)" title="Previous"><i class="fas fa-chevron-left"></i></button><button class="btn-outline" onclick="planbookController.goToday()">Today</button><button class="btn-outline" onclick="planbookController.navigate(1)" title="Next"><i class="fas fa-chevron-right"></i></button><div class="date-title" id="pb-date-display">Loading…</div></div>

</div>
