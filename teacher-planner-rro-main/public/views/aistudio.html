<style>
  .ai-studio-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:20px;align-items:start}.ai-card h3{display:flex;align-items:center;gap:8px;margin-top:0}.ai-output{margin-top:16px;background:var(--note-bg);padding:16px;border-radius:11px;min-height:150px;border:1px solid var(--border);line-height:1.6;overflow:auto}.ai-output table{border-collapse:collapse;width:100%}.ai-output td,.ai-output th{border:1px solid var(--border);padding:6px}.ai-wait{display:flex;align-items:center;gap:8px;color:var(--text-muted)}.tool-count{font-size:.7rem;background:var(--accent);color:#fff;border-radius:999px;padding:4px 7px;margin-left:auto}.ai-field-label{display:block;font-size:.8rem;font-weight:750;margin:0 0 6px;color:var(--text-muted)}@media(max-width:700px){.ai-studio-grid{grid-template-columns:1fr}}

cy & Language"><option value="comprehension">📘 Differentiated Comprehension</option><option value="spag">✍️ SPaG Correction Generator</option><option value="vocab">🔤 Tier 2 / Tier 3 Vocabulary</option><option value="model_answer">🏆 WAGOLL / Model Answer</option><option value="debate">🗣️ Class Debate Motion</option><option value="writing_frame">🧱 Writing Frame</option><option value="summary">📝 Student-Friendly Summary</option><option value="glossary">📕 Glossary Builder</option><option value="command_words">🎯 Exam Command-Word Trainer</option></optgroup><optgroup label="Assessment & Marking"><option value="quiz">❓ Knowledge Quiz + Answers</option><option value="short_test">🧪 Short Assessment + Mark Scheme</option><option value="markscheme">🧠 Marking AI Pro / Mark-Scheme Analysis</option><option value="exam_questions">📝 Exam-Style Questions</option><option value="feedback_bank">💬 Feedback Statement Bank</option><option value="self_assessment">🪞 Self-Assessment Tool</option><option value="peer_assessment">🤝 Peer-Assessment Tool</option><option value="gap_analysis">🔍 Knowledge-Gap Analysis</option></optgroup><optgroup label="Pastoral, Parents & Leadership"><option value="reports">📄 Report Comment Generator</option><option value="email_praise">🌟 Positive Parent/Carer Email</option><option value="email_angry">🕊️ De-escalation Parent/Carer Email</option><option value="newsletter">📰 Newsletter Copy</option><option value="parent_call">📞 Parent Call Script</option><option value="detention_script">🔄 Restorative Detention Script</option><option value="pastoral_plan">❤️ Pastoral Intervention Plan</option><option value="assembly">🎤 Assembly Script</option><option value="policy">📜 School Policy Draft</option><option value="observation">👀 Lesson Observation Feedback</option><option value="sip">📈 School Improvement Plan Actions</option><option value="governor">🏛️ Governor Briefing</option><option value="cpd">🎓 CPD Session Plan</option><option value="risk">⚠️ Risk Assessment</option><
