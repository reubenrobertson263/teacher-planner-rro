<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Digital Planner</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-color: #f4f6f8; 
        }
        .header { 
            background: #2c3e50; 
            color: white; 
            padding: 20px; 
            border-radius: 8px; 
            text-align: center; 
            margin-bottom: 20px;
        }
        .header h1 {
            margin: 0;
            font-size: 2rem;
        }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 15px; 
        }
        .day { 
            background: white; 
            padding: 15px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
        }
        h2 { 
            font-size: 1.2rem; 
            text-align: center; 
            border-bottom: 3px solid #3498db; 
            padding-bottom: 10px; 
            margin-top: 0;
            color: #2c3e50;
        }
        .period { 
            border: 1px solid #e0e0e0; 
            margin: 10px 0; 
            padding: 15px; 
            border-radius: 6px; 
            min-height: 80px;
            background-color: #fafafa;
        }
        .period-title {
            font-weight: bold;
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }
        .content {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Digital Planner</h1>
        <p>Your weekly lesson overview</p>
    </div>
    
    <div class="grid">
        <div class="day">
            <h2>Monday</h2>
            <div class="period"><div class="period-title">Period 1</div><div class="content"></div></div>
            <div class="period"><div class="period-title">Period 2</div><div class="content"></div></div>
            <div class="period"><div class="period-title">Period 3</div><div class="content"></div></div>
        </div>
        <div class="day">
            <h2>Tuesday</h2>
            <div class="period"><div class="period-title">Period 1</div><div class="content"></div></div>
            <div class="period"><div class="period-title">Period 2</div><div class="content"></div></div>
            <div class="period"><div class="period-title">Period 3</div><div class="content"></div></div>
        </div>
        <div class="day">
            <h2>Wednesday</h2>
            <div class="period"><div class="period-title">Period 1</div><div class="content"></div></div>
            <div class="period"><div class="period-title">Period 2</div><div class="content"></div></div>
            <div class="period"><div class="period-title">Period 3</div><div class="content"></div></div>
        </div>
        <div class="day">
            <h2>Thursday</h2>
            <div class="period"><div class="period-title">Period 1</div><div class="content"></div></div>
            <div class="period"><div class="period-title">Period 2</div><div class="content"></div></div>
            <div class="period"><div class="period-title">Period 3</div><div class="content"></div></div>
        </div>
        <div class="day">
            <h2>Friday</h2>
            <div class="period"><div class="period-title">Period 1</div><div class="content"></div></div>
            <div class="period"><div class="period-title">Period 2</div><div class="content"></div></div>
            <div class="period"><div class="period-title">Period 3</div><div class="content"></div></div>
        </div>
    </div>
</body>
</html>
