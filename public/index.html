<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Digital Planner</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f4f6f8; }
        .header { background: #2c3e50; color: white; padding: 20px; border-radius: 8px; text-align: center; margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 2rem; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; }
        .day { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { font-size: 1.2rem; text-align: center; border-bottom: 3px solid #3498db; padding-bottom: 10px; margin-top: 0; color: #2c3e50; }
        .period { border: 1px solid #e0e0e0; margin: 10px 0; padding: 10px; border-radius: 6px; min-height: 100px; background-color: #fafafa; display: flex; flex-direction: column; }
        .period-title { font-weight: bold; color: #7f8c8d; font-size: 0.9rem; margin-bottom: 8px; user-select: none; }
        .content { flex-grow: 1; outline: none; border: 1px dashed transparent; padding: 5px; cursor: text; transition: border 0.2s; white-space: pre-wrap; }
        .content:focus { border-color: #3498db; background: #fff; }
        .saved-toast { position: fixed; bottom: 20px; right: 20px; background: #2ecc71; color: white; padding: 10px 20px; border-radius: 5px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Digital Planner</h1>
        <p>Your interactive lesson overview</p>
    </div>
    
    <div class="grid" id="planner-grid">
        <!-- Rendered by JavaScript -->
    </div>
    
    <div id="toast" class="saved-toast">Saved!</div>

    <script>
        const days = [
            { name: 'Monday', date: '2026-08-10' },
            { name: 'Tuesday', date: '2026-08-11' },
            { name: 'Wednesday', date: '2026-08-12' },
            { name: 'Thursday', date: '2026-08-13' },
            { name: 'Friday', date: '2026-08-14' }
        ];
        const periods = [1, 2, 3];
        const grid = document.getElementById('planner-grid');

        // Build the grid
        days.forEach(day => {
            let html = `<div class="day"><h2>${day.name}</h2>`;
            periods.forEach(p => {
                html += `
                <div class="period">
                    <div class="period-title">Period ${p}</div>
                    <div class="content" contenteditable="true" data-date="${day.date}" data-period="${p}"></div>
                </div>`;
            });
            html += `</div>`;
            grid.innerHTML += html;
        });

        // Auto-save logic
        document.querySelectorAll('.content').forEach(box => {
            box.addEventListener('blur', async (e) => {
                const text = e.target.innerText;
                const date = e.target.getAttribute('data-date');
                const period = e.target.getAttribute('data-period');
                
                await fetch('/api/lessons', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ date, period, planText: text })
                });
                
                const toast = document.getElementById('toast');
                toast.style.opacity = 1;
                setTimeout(() => toast.style.opacity = 0, 2000);
            });
        });

        // Load existing lessons on startup
        window.addEventListener('DOMContentLoaded', async () => {
            const res = await fetch('/api/lessons');
            const lessons = await res.json();
            
            lessons.forEach(lesson => {
                const dateStr = lesson.date.split('T')[0];
                const box = document.querySelector(`.content[data-date="${dateStr}"][data-period="${lesson.period}"]`);
                if (box) box.innerText = lesson.planText;
            });
        });
    </script>
</body>
</html>
