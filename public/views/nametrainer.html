<header class="topbar">
    <div class="left-controls">
        <button type="button" class="mobile-menu-btn" onclick="app.toggleMenu()"><i class="fas fa-bars"></i></button>
        <div class="date-title">Name Trainer <span class="help-icon" title="Learn names via profile pictures."><i class="fas fa-question-circle"></i></span></div>
    </div>
    <div class="right-controls">
        <span style="font-size: 0.85em; color: var(--text-muted); margin-right:10px;" id="nt-roster-count">0 students in memory</span>
    </div>
</header>

<div class="scrollable-container" style="display:flex; flex-direction:column; align-items:center;">
    
    <!-- Controls -->
    <div class="settings-card" style="width:100%; max-width:800px; display:flex; gap:16px; margin-bottom: 24px; flex-wrap: wrap;">
        <select class="form-control" id="nt-filter-type" style="flex:1; min-width: 130px;" onchange="nametrainerController.populateNTFilterValues()">
            <option value="year">By Year Group</option>
            <option value="class">By Class Code</option>
            <option value="all">Whole School</option>
        </select>
        
        <div style="flex:1; min-width: 150px; position:relative;">
            <input list="nt-filter-options" id="nt-filter-value" class="form-control" placeholder="Search (e.g. 10)..." style="width:100%;">
            <datalist id="nt-filter-options"></datalist>
        </div>
        
        <select class="form-control" id="nt-difficulty" style="flex:1.5; min-width: 170px;">
            <option value="full">Normal (Full Name)</option>
            <option value="first">Easy (First Name)</option>
            <option value="last">Hard (Surname)</option>
            <option value="type">Expert (Type Name)</option>
        </select>

        <button type="button" class="btn-outline" style="min-width: 50px;" onclick="nametrainerController.toggleNTSound()" id="nt-sound-btn" title="Toggle Sound"><i class="fas fa-volume-up"></i></button>
        <button type="button" class="btn-primary" style="flex:1; min-width: 100px;" onclick="nametrainerController.startNTQuiz()"><i class="fas fa-play"></i> Start</button>
    </div>

    <!-- Quiz Area -->
    <div id="nt-quiz-area" style="display:none; flex-direction:column; align-items:center; width:100%; max-width:500px;">
        <h3 style="margin-top:0; color:var(--text-main); font-size:1.5em; margin-bottom: 20px;">Who is this?</h3>
        <div id="nt-photo-box" style="width: 280px; height: 320px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 24px; display:flex; align-items:center; justify-content:center; overflow:hidden; box-shadow: var(--shadow-md);">
            <i class="fas fa-user-graduate" style="font-size: 6em; color: var(--border);"></i>
        </div>

        <div style="display:flex; gap:12px; margin-bottom:24px; font-size:0.9em; color:var(--text-muted); font-weight:600;">
            <span>Level: <span id="nt-stat-level" style="color:var(--accent);">1</span></span> | 
            <span>Right: <span id="nt-stat-right" style="color:#10b981;">0</span></span> | 
            <span>Wrong: <span id="nt-stat-wrong" style="color:#ef4444;">0</span></span>
        </div>

        <!-- Multiple Choice Grid -->
        <div id="nt-options-grid" style="display:grid; grid-template-columns: 1fr 1fr; gap: 16px; width:100%;"></div>

        <!-- Type Answer Input -->
        <div id="nt-type-container" style="display:none; width: 100%; text-align: center;">
            <input type="text" id="nt-type-input" class="form-control" placeholder="Type the student's name..." style="font-size: 1.2em; padding: 15px; margin-bottom: 15px; text-align:center;" onkeypress="if(event.key === 'Enter') nametrainerController.handleNTTypeAnswer()">
            <button type="button" class="btn-primary" style="width: 100%; padding: 15px; font-size: 1.1em;" onclick="nametrainerController.handleNTTypeAnswer()">Submit Answer</button>
            <div id="nt-type-feedback" style="margin-top: 15px; font-weight: bold; font-size: 1.2em;"></div>
        </div>
    </div>
    
    <!-- Empty State -->
    <div id="nt-empty-state" style="text-align:center; padding: 40px; color: var(--text-muted);">
        <i class="fas fa-id-badge fa-3x" style="margin-bottom:16px; color: var(--border);"></i>
        <p>Ready to start.</p>
        <p style="font-size:0.85em; max-width: 400px; margin: 0 auto; line-height: 1.5;">Upload your Master File in Settings to extract profile pictures and begin.</p>
    </div>
</div>
