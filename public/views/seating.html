<style>
  .seating-wrapper{display:flex;flex:1;overflow:hidden;background:var(--bg);position:relative}.seating-sidebar{width:300px;background:var(--card);border-right:1px solid var(--border);padding:18px;display:flex;flex-direction:column;overflow-y:auto}.seat-section{margin:0 0 9px;font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted)}.seat-button-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:18px}.seat-button-grid button{justify-content:center;padding:7px}.student-pool-pill{background:var(--note-bg);border:1px solid var(--border);padding:8px 10px;border-radius:8px;font-size:.84rem;cursor:grab;font-weight:700}.unassigned-pool{flex:1;overflow-y:auto;border:2px dashed var(--border);border-radius:11px;padding:9px;display:flex;flex-direction:column;gap:6px;min-height:140px}.seating-canvas{flex:1;position:relative;overflow:auto;min-width:600px;min-height:600px;background-image:radial-gradient(var(--border) 1px,transparent 0);background-size:20px 20px}.seating-canvas.is-loading:after{content:'Loading saved plan…';position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 80%,transparent);display:grid;place-items:center;font-weight:800;z-index:999}.desk-placeholder,.desk-card{position:absolute;width:110px;height:65px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:grab;box-sizing:border-box}.desk-placeholder{background:color-mix(in srgb,var(--border) 65%,var(--card));border:2px dashed var(--text-muted);font-size:.72rem;color:var(--text-muted)}.desk-card{background:var(--card);border:2px solid var(--accent);padding:5px;box-shadow:var(--shadow-md);flex-direction:column}.desk-card.highlight{box-shadow:0 0 0 5px #10b981,0 12px 20px rgba(0,0,0,.25);z-index:100}.desk-name{font-weight:800;font-size:.82rem;text-align:center;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab}.desk-meta{font-size:.68rem;color:var(--text-muted)}.privacy-dots{display:flex;gap:4px;margin-top:3px}.dot{width:7px;height:7px;border-radius:50%}.dot-sen{background:#8b5cf6}.dot-pp{background:#f59e0b}.dot-fsm{background:#10b981}.room-furniture{position:absolute;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;border:2px solid var(--text-muted);background:var(--card);color:var(--text);cursor:grab;font-size:.78rem;font-weight:800;box-sizing:border-box}.furniture-whiteboard{width:200px;height:24px}.furniture-teacher{width:130px;height:62px}.noise-meter{height:20px;background:var(--border);border-radius:999px;overflow:hidden}.noise-meter-fill{height:100%;width:3%;background:linear-gradient(90deg,#22c55e,#eab308,#ef4444);transform-origin:center;transition:width .06s linear}.active{outline-color:var(--accent)!important}.projector-active #seating-topbar,.projector-active #seating-sidebar{display:none!important}.projector-active #seating-main-wrapper{position:fixed;inset:0;z-index:9999}.projector-active .seating-canvas{min-width:100vw;min-height:100vh;background-image:none!important}@media(max-width:900px){.seating-wrapper{overflow:auto;flex-direction:column}.seating-sidebar{width:auto;border-right:0;border-bottom:1px solid var(--border);max-height:430px}.seating-canvas{min-height:650px}}
</style>
<div class="topbar" id="seating-topbar">
  <div class="left-controls"><button type="button" class="mobile-menu-btn" onclick="app.toggleMenu()"><i class="fas fa-bars"></i></button><div class="date-title">FlowDesk Seating Plans</div></div>
  <div class="right-controls"><select id="seating-room-select" class="form-control" style="width:auto" onchange="seatingController.loadSelectedSeatingPlan()"></select><select id="seating-class-select" class="form-control" style="width:auto" onchange="seatingController.loadSelectedSeatingPlan()"></select><button class="btn-outline" onclick="seatingController.undo()"><i class="fas fa-undo"></i> Undo</button><button class="btn-primary" onclick="seatingController.saveLayout(this)"><i class="fas fa-save"></i> Save Plan</button></div>
</div>
<div class="seating-wrapper" id="seating-main-wrapper">
  <aside class="seating-sidebar" id="seating-sidebar">
    <h4 class="seat-section">Room builder</h4><div class="seat-button-grid"><button class="btn-outline" onclick="seatingController.addDesk()"><i class="fas fa-plus"></i> Desk</button><button class="btn-outline" onclick="seatingController.addFurniture('teacher')">Teacher</button><button class="btn-outline" onclick="seatingController.addFurniture('whiteboard')">Board</button><button class="btn-outline" onclick="seatingController.flipRoom()"><i class="fas fa-rotate"></i> Flip 180°</button><button class="btn-outline" style="color:#ef4444" onclick="seatingController.clearDesks()"><i class="fas fa-trash"></i> Wipe</button><button class="btn-outline" id="privacy-toggle" onclick="seatingController.togglePrivacy()"><i class="fas fa-eye-slash"></i> Privacy dots</button></div>
    <h4 class="seat-section">Smart seating</h4><div class="seat-button-grid"><button class="btn-outline" onclick="seatingController.autoSeat()"><i class="fas fa-wand-magic-sparkles"></i> Auto-Seat</button><button class="btn-outline" onclick="seatingController.alternateBoyGirl()"><i class="fas fa-venus-mars"></i> B/G Alt</button><button class="btn-outline" style="grid-column:span 2" onclick="seatingController.unseatAll()"><i class="fas fa-users-slash"></i> Unseat All</button></div>
    <h4 class="seat-section">Projector tools</h4><div style="display:flex;flex-direction:column;gap:7px;margin-bottom:18px"><button class="btn-outline" onclick="seatingController.toggleProjectorMode()"><i class="fas fa-expand"></i> Full Screen Mode</button><button class="btn-outline" onclick="seatingController.pickRandomName()"><i class="fas fa-dice"></i> Random Name Picker</button><button class="btn-outline" id="noise-toggle" onclick="seatingController.toggleNoiseMeter()"><i class="fas fa-microphone-lines"></i> Live Noise Meter</button><div class="noise-meter"><div class="noise-meter-fill"></div></div><small class="noise-meter-value" style="color:var(--text-muted)">0%</small></div>
    <h4 class="seat-section" style="display:flex;justify-content:space-between">Unassigned pool <span id="pool-count">0</span></h4><div id="unassigned-pool" class="unassigned-pool" ondragover="seatingController.allowDrop(event)" ondrop="seatingController.dropToCanvasVoid(event)"></div>
  </aside>
  <main class="seating-canvas" id="seating-canvas" ondragover="seatingController.allowDrop(event)" ondrop="seatingController.dropToCanvasVoid(event)" aria-label="Seating plan canvas"></main>
  <div id="projector-overlay" style="display:none;position:absolute;top:18px;right:18px;width:min(360px,calc(100vw - 36px));background:var(--card);padding:15px;border-radius:14px;box-shadow:var(--shadow-md);z-index:10000;flex-direction:column;gap:14px;border:2px solid var(--accent)">
    <button class="btn-outline" style="position:absolute;right:8px;top:8px;padding:4px 7px" onclick="seatingController.toggleProjectorMode()"><i class="fas fa-times"></i></button>
    <div id="pt-random" style="display:none;text-align:center"><div style="font-size:.75rem;font-weight:800;color:var(--text-muted)">Selected student</div><div id="random-name-display" style="font-size:1.8rem;font-weight:900;color:var(--accent);padding:12px">???</div><button class="btn-primary" onclick="seatingController.spinRandomName()"><i class="fas fa-dice"></i> Pick Again</button></div>
    <div id="pt-noise" style="display:none"><div style="display:flex;justify-content:space-between;font-weight:850;margin-bottom:8px"><span>Live Noise Meter</span><span class="noise-meter-value">0%</span></div><div class="noise-meter" style="height:34px"><div class="noise-meter-fill"></div></div></div>
  </div>
</div>
