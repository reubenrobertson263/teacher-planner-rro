<div class="topbar">
    <div class="left-controls">
        <button type="button" class="mobile-menu-btn" onclick="app.toggleMenu()"><i class="fas fa-bars"></i></button>
        <div class="date-title">Interactive Seating Plans</div>
    </div>
    <div class="right-controls">
        <select id="seating-class-select" class="form-control" style="width: auto;" onchange="seatingController.loadClassSeating()"></select>
        <select id="seating-room-select" class="form-control" style="width: auto;" onchange="seatingController.loadClassSeating()"></select>
        <button type="button" class="btn-primary" onclick="seatingController.saveLayout(this)"><i class="fas fa-save"></i> Save Plan</button>
    </div>
</div>

<div class="scrollable-container" style="display: flex; gap: 20px; overflow: hidden; padding-bottom: 0;">
    <!-- SIDEBAR: UNSEATED STUDENTS -->
    <div style="width: 280px; display: flex; flex-direction: column;" class="settings-card">
        <h3 style="margin-top:0; font-size:1em; border-bottom:1px solid var(--border); padding-bottom:8px;">Unassigned Students</h3>
        <div id="unseated-students-list" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 10px 0;"></div>
        <button type="button" class="btn-outline" style="width: 100%; justify-content: center; margin-top: 10px;" onclick="seatingController.autoSeat()"><i class="fas fa-magic"></i> Auto-Seat Students</button>
    </div>

    <!-- CANVAS GRID -->
    <div style="flex: 1; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px; position: relative; overflow: auto;" id="seating-canvas">
        <div style="display: flex; gap: 10px; margin-bottom: 16px;">
            <button type="button" class="btn-outline" onclick="seatingController.addDesk()"><i class="fas fa-plus"></i> Add Desk</button>
            <button type="button" class="btn-outline" onclick="seatingController.clearDesks()"><i class="fas fa-trash"></i> Clear All</button>
        </div>
        <div id="desk-matrix" style="display: grid; grid-template-columns: repeat(6, 120px); gap: 16px; flex: 1; align-content: start;"></div>
    </div>
</div>
