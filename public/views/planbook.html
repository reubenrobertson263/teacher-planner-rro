<style>
    /* Chalk Aesthetic UI Overlay */
    .pb-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: var(--card); border-bottom: 1px solid var(--border); }
    .pb-view-toggle { display: flex; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
    .pb-view-btn { background: var(--card); border: none; padding: 6px 16px; cursor: pointer; color: var(--text-muted); font-weight: 600; font-size: 0.85em; border-right: 1px solid var(--border); }
    .pb-view-btn:last-child { border-right: none; }
    .pb-view-btn.active { background: #4b5563; color: white; }
    
    .pb-chalk-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 16px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; min-height: 200px; }
    .pb-chalk-header { background: #5b5b7b; /* Dark Purple Chalk Header */ color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .pb-chalk-title { font-weight: 700; font-size: 1em; margin-bottom: 4px; }
    .pb-chalk-time { font-size: 0.75em; opacity: 0.8; }
    .pb-chalk-body { padding: 16px; flex: 1; outline: none; line-height: 1.6; }
    .pb-chalk-controls { padding: 8px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; background: #f9fafb; align-items: center; }
    
    .pb-yellow-note { background: var(--note-bg); border: 1px solid #fde047; border-radius: var(--radius-sm); padding: 16px; min-height: 150px; outline: none; margin-bottom: 16px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
    
    /* Grid for Week View */
    .pb-week-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; padding: 24px; min-width: 1000px; }
    .pb-day-col { display: flex; flex-direction: column; }
    .pb-day-header { text-align: left; font-weight: 700; padding-bottom: 12px; border-bottom: 2px solid var(--border); margin-bottom: 16px; color: var(--text-main); font-size: 0.9em; display:flex; align-items:center; justify-content:space-between; }
    
    /* Layout for Day View */
    .pb-day-layout { display: flex; gap: 24px; padding: 24px; }
    .pb-day-main { flex: 3; display:flex; flex-direction: column; gap: 16px; }
    .pb-day-side { flex: 1; min-width: 280px; }
    
    .pb-empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); background: var(--card); border-radius: var(--radius-sm); border: 1px dashed var(--border); }
</style>

<div class="pb-toolbar">
    <div class="left-controls" style="display:flex; align-items:center; gap:16px;">
        <button type="button" class="btn-outline" onclick="planbookController.navigate(-1)"><i class="fas fa-arrow-left"></i></button>
        <button type="button" class="btn-outline" onclick="planbookController.navigate(1)"><i class="fas fa-arrow-right"></i></button>
        <div class="date-title" id="pb-date-display" style="font-size: 1.2em;"><i class="far fa-calendar"></i> Loading...</div>
    </div>
    <div class="right-controls">
        <div class="pb-view-toggle">
            <button class="pb-view-btn active" id="btn-view-day" onclick="planbookController.setView('day')">Day</button>
            <button class="pb-view-btn" id="btn-view-week" onclick="planbookController.setView('week')">Week</button>
        </div>
    </div>
</div>

<div style="flex:1; overflow:auto; background: #f3f4f6;">
    <div id="pb-view-container">
        <!-- Rendered via JS -->
    </div>
</div>
