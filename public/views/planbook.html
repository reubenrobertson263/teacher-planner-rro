<div class="topbar">
    <div class="left-controls">
        <button type="button" class="mobile-menu-btn" onclick="app.toggleMenu()"><i class="fas fa-bars"></i></button>
        <button type="button" class="btn-icon" onclick="window.planbookController.navigateDate(-1)"><i class="fas fa-chevron-left"></i></button>
        <button type="button" class="btn-icon" onclick="window.planbookController.navigateDate(1)"><i class="fas fa-chevron-right"></i></button>
        <div class="date-title" id="header-date-range" style="margin-left: 10px;">Loading...</div>
        <span class="help-icon" title="Digital lesson planner with auto-save."><i class="fas fa-question-circle"></i></span>
    </div>
    <div class="right-controls">
        <div style="background:var(--border); border-radius:var(--radius-sm); padding:4px; display:flex; gap:4px; margin-left:16px;">
            <button type="button" id="btn-view-day" onclick="window.planbookController.setPlanbookView('day')" style="padding:4px 12px; border:none; background:transparent; border-radius:4px; font-size:0.85em; cursor:pointer; color:var(--text-muted); font-weight:600;">Day</button>
            <button type="button" id="btn-view-week" onclick="window.planbookController.setPlanbookView('week')" style="padding:4px 12px; border:none; background:var(--card); box-shadow:var(--shadow-sm); border-radius:4px; font-size:0.85em; cursor:pointer; color:var(--text-main); font-weight:600;">Week</button>
        </div>
    </div>
</div>
<div class="global-toolbar">
    <div class="toolbar-group">
        <button type="button" onmousedown="event.preventDefault()" onclick="document.execCommand('bold', false, null)" title="Bold"><i class="fas fa-bold"></i></button>
        <button type="button" onmousedown="event.preventDefault()" onclick="document.execCommand('italic', false, null)" title="Italic"><i class="fas fa-italic"></i></button>
        <button type="button" onmousedown="event.preventDefault()" onclick="document.execCommand('underline', false, null)" title="Underline"><i class="fas fa-underline"></i></button>
    </div>
</div>
<div class="scrollable-container">
    <div class="horizontal-scroll-wrapper">
        <div class="grid" id="planner-grid"></div>
    </div>
</div>
