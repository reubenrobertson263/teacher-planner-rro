<div class="topbar">
    <div class="left-controls">
        <button type="button" class="mobile-menu-btn" onclick="app.toggleMenu()"><i class="fas fa-bars"></i></button>
        <div class="date-title">Timetable Builder <span class="help-icon" title="Search classes, pin to sidebar, and drag onto the timetable grid."><i class="fas fa-question-circle"></i></span></div>
    </div>
    <div class="right-controls">
        <select id="builder-week-select" class="form-control" style="width: auto; display: inline-block; margin-right: 10px;" onchange="timetableController.renderDnDGrid()">
            <option value="A">Week A</option>
            <option value="B">Week B</option>
        </select>
        <button type="button" class="btn-primary" id="btn-save-timetable" onclick="timetableController.saveTimetable(this)"><i class="fas fa-save"></i> Save Timetable</button>
    </div>
</div>

<div class="scrollable-container" style="display: flex; gap: 24px; overflow: hidden; padding-bottom: 0;">
    <div style="width: 320px; display: flex; flex-direction: column; overflow: hidden;" class="settings-card">
        <h3 style="margin-top:0; font-size:1.1em; border-bottom: 1px solid var(--border); padding-bottom: 10px;">Your Classes & Elements</h3>
        
        <div style="margin-bottom: 15px; position:relative;">
            <input list="all-classes-list" id="timetable-class-search" class="form-control" placeholder="Search & Add to My Classes...">
            <datalist id="all-classes-list"></datalist>
            <button type="button" class="btn-primary" style="width:100%; margin-top:8px; padding:8px;" onclick="timetableController.pinClassToSidebar()"><i class="fas fa-plus"></i> Pin to Sidebar</button>
        </div>

        <div id="class-list-container" style="display:flex; flex-direction:column; gap: 8px; flex: 1; overflow-y: auto; padding-right: 10px; border-top: 1px solid var(--border); padding-top: 10px;"></div>
        
        <h3 style="margin-top:20px; font-size:1em;">Add Custom Pill</h3>
        <input type="text" id="new-elem-name" class="form-control" placeholder="Name (e.g. PPA)" style="margin-bottom:8px;">
        <button type="button" class="btn-outline" style="width:100%; justify-content:center;" onclick="timetableController.createTimetableElement()">Create Pill</button>
    </div>
    <div style="flex: 1; overflow-y: auto; overflow-x:auto; padding-bottom: 40px;">
        <div style="display: grid; grid-template-columns: 100px repeat(5, 1fr); gap: 10px; min-width: 600px; min-height:500px;" id="dnd-master-grid"></div>
    </div>
</div>
