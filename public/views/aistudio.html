<style>
  .ai-studio-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:20px;align-items:start}.ai-card h3{display:flex;align-items:center;gap:8px;margin-top:0}.ai-output{margin-top:16px;background:var(--note-bg);padding:16px;border-radius:11px;min-height:150px;border:1px solid var(--border);line-height:1.6;overflow:auto}.ai-output table{border-collapse:collapse;width:100%}.ai-output td,.ai-output th{border:1px solid var(--border);padding:6px}.ai-wait{display:flex;align-items:center;gap:8px;color:var(--text-muted)}.tool-count{font-size:.7rem;background:var(--accent);color:#fff;border-radius:999px;padding:4px 7px;margin-left:auto}.ai-field-label{display:block;font-size:.8rem;font-weight:750;margin:0 0 6px;color:var(--text-muted)}@media(max-width:700px){.ai-studio-grid{grid-template-columns:1fr}}
</style>
<header class="topbar"><div class="left-controls"><button type="button" class="mobile-menu-btn" onclick="app.toggleMenu()"><i class="fas fa-bars"></i></button><div class="date-title">AI Studio</div></div></header>
<div class="scrollable-container">
  <section class="settings-card ai-card" style="margin-bottom:20px"><h3><i class="fas fa-file-powerpoint"></i> Slide Deck Generator</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:12px"><div><label class="ai-field-label">Differentiation target</label><select class="form-control" id="ai-keystage"><option value="KS3">Key Stage 3</option><option value="KS4">Key Stage 4 (GCSE 9–1)</option><option value="Vocational">Vocational (L1P–L2D*)</option></select></div><div><label class="ai-field-label">Curriculum / specification</label><input id="ai-curriculum" class="form-control" placeholder="e.g. OCR J277, BTEC Enterprise"></div></div><label class="ai-field-label">Your preferred slide sequence</label><textarea id="ai-slide-structure" class="form-control" rows="4" style="margin-bottom:12px">1. Retrieve
2. Learning Intentions
3. Explicit Instruction
4. Apply
5. Review</textarea><input id="ai-slide-topic" class="form-control" placeholder="Lesson topic" style="margin-bottom:12px;font-weight:750"><button type="button" class="btn-primary" id="btn-slide-gen" onclick="aistudioController.generatePowerPoint()"><i class="fas fa-file-arrow-down"></i> Generate PPTX</button></section>
  <div class="ai-studio-grid">
    <section class="settings-card ai-card"><h3><i class="fas fa-toolbox"></i> The Ultimate Toolkit <span class="tool-count" id="toolkit-count">Loading…</span></h3><label class="ai-field-label">Choose a tool</label><select id="ai-tool-select" class="form-control" style="margin-bottom:12px"></select><label class="ai-field-label">Topic, context or rough notes</label><textarea id="ai-tool-topic" class="form-control" rows="6" placeholder="Include the subject, year group, topic and constraints you want the AI to respect." style="margin-bottom:12px"></textarea><button type="button" class="btn-primary" id="btn-toolkit-gen" onclick="aistudioController.runToolkit()"><i class="fas fa-wand-magic-sparkles"></i> Generate Resource</button><div id="ai-tool-output" class="ai-output"><span style="color:var(--text-muted)">Your generated resource will appear here.</span></div></section>
    <section class="settings-card ai-card"><h3><i class="fas fa-check-double"></i> Marking AI Pro</h3><label class="ai-field-label">Assessment criteria / mark scheme (recommended)</label><textarea id="ai-marking-criteria" rows="4" class="form-control" placeholder="Paste the criteria, rubric or mark-scheme extract here…" style="margin-bottom:10px"></textarea><label class="ai-field-label">Student submission</label><textarea id="ai-marking-input" rows="9" class="form-control" placeholder="Paste the submission here. Do not include unnecessary personal data." style="margin-bottom:12px"></textarea><button type="button" class="btn-primary" id="btn-mark-gen" onclick="aistudioController.runAutoMarker()"><i class="fas fa-magnifying-glass-chart"></i> Analyse & Generate Feedback</button><div id="ai-marking-output" class="ai-output"><span style="color:var(--text-muted)">Evidence-based feedback will appear here.</span></div></section>
  </div>
</div>
