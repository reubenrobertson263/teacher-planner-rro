<header class="topbar">
    <div class="left-controls">
        <button type="button" class="mobile-menu-btn" onclick="app.toggleMenu()"><i class="fas fa-bars"></i></button>
        <div class="date-title">AI Studio</div>
    </div>
</header>

<div class="scrollable-container">
    <div class="settings-card" style="margin-bottom: 24px;">
        <h3 style="margin-top:0; color:var(--accent); font-size: 1.3em;"><i class="fas fa-file-powerpoint"></i> Slide Deck Generator</h3>
        <div style="display:flex; gap: 16px; margin-bottom:16px; flex-wrap: wrap;">
            <div style="flex:1; min-width: 250px;">
                <label style="display:block; font-size:0.85em; font-weight:600; margin-bottom:6px;">Differentiation Target</label>
                <select class="form-control" id="ai-keystage">
                    <option value="KS3">Key Stage 3</option>
                    <option value="KS4">Key Stage 4 (GCSE 9-1)</option>
                    <option value="Vocational">Vocational (L1P to L2D*)</option>
                </select>
            </div>
            <div style="flex:1; min-width: 250px;">
                <label style="display:block; font-size:0.85em; font-weight:600; margin-bottom:6px;">Curriculum Framework</label>
                <input type="text" id="ai-curriculum" class="form-control" placeholder="e.g., OCR J837, AQA History">
            </div>
        </div>
        <textarea id="ai-slide-structure" class="form-control" rows="4" style="margin-bottom:16px; font-family: monospace;">1. Retrieve (Flashback 4)
2. Learning Intentions
3. Explicit Instruction (Model-Lead-Test)
4. Green Zone (Independent Task)
5. Review (Purple Pen)</textarea>
        <input type="text" id="ai-slide-topic" class="form-control" placeholder="What are we learning today?" style="margin-bottom:20px; font-weight: bold; font-size: 1.1em; padding: 16px;">
        <button type="button" class="btn-primary" style="width:100%; padding: 14px;" id="btn-slide-gen" onclick="aistudioController.generatePowerPoint()"><i class="fas fa-download"></i> Generate PPTX File</button>
    </div>

    <div class="ai-studio-layout" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 24px; align-items: start;">
        
        <div class="settings-card" style="margin-bottom: 0;">
            <h3 style="margin-top:0; color:#8b5cf6; font-size: 1.3em;"><i class="fas fa-toolbox"></i> The Ultimate Toolkit</h3>
            <select id="ai-tool-select" class="form-control" style="margin-bottom: 16px;">
                <optgroup label="Classroom & Teaching">
                    <option value="song">🎵 Turn Lesson into a Pop Song</option>
                    <option value="comprehension">📝 Differentiated Comprehension Task</option>
                    <option value="explainer">🧠 Concept Explainer (Like I'm 11)</option>
                    <option value="spag">✏️ SPaG Correction Exercise</option>
                    <option value="quiz">❓ Multiple Choice Quiz Generator</option>
                    <option value="sow">📅 6-Week Scheme of Work</option>
                    <option value="reports">📊 Report Card Comment Generator</option>
                    <option value="vocab">📖 Tier 3 Vocabulary Builder</option>
                    <option value="debate">🗣️ Class Debate Motion Generator</option>
                    <option value="hook">🪝 Lesson Hook / Starter Activity</option>
                    <option value="exit">🚪 Exit Ticket Generator</option>
                </optgroup>
                <optgroup label="SEN, Inclusion & EAL">
                    <option value="iep">🎯 IEP Strategies Generator</option>
                    <option value="dyslexia_adapt">👓 Dyslexia Text Adapter</option>
                    <option value="eal_vocab">🌍 EAL Phonics & Visual Dictionary</option>
                    <option value="adhd_scaffold">🧩 ADHD Task Scaffolder (Step-by-step)</option>
                    <option value="autism_clear">🎯 Autistic Spectrum: Literal Translation</option>
                </optgroup>
                <optgroup label="Leadership & Admin">
                    <option value="policy">📜 Draft a School Policy Document</option>
                    <option value="newsletter">📰 Parent/Carer Newsletter</option>
                    <option value="observation">👁️ Lesson Observation Feedback</option>
                    <option value="sip">🎯 School Improvement Plan (SIP) Target</option>
                    <option value="governor">🏛️ Governor Report Section</option>
                    <option value="cpd">🎓 Staff CPD Session Planner</option>
                    <option value="risk">⚠️ Risk Assessment Generator</option>
                    <option value="email_angry">✉️ De-escalation Email to Parent</option>
                    <option value="email_praise">🏆 Positive Praise Email to Parent</option>
                    <option value="assembly">🎤 Assembly Script Generator</option>
                </optgroup>
            </select>
            <textarea id="ai-tool-topic" class="form-control" rows="4" placeholder="Enter topic, context, or rough notes here..." style="margin-bottom:20px;"></textarea>
            <button type="button" class="btn-primary" style="width:100%; background:#8b5cf6; padding: 12px;" id="btn-toolkit-gen" onclick="aistudioController.runToolkit()"><i class="fas fa-magic"></i> Generate Resource</button>
            <div id="ai-tool-output" style="margin-top:20px; background:var(--note-bg); padding:20px; border-radius:var(--radius-sm); font-size:0.95em; min-height:150px; border: 1px solid var(--border); line-height: 1.6;"></div>
        </div>
        
        <div class="settings-card" style="margin-bottom: 0;">
            <h3 style="margin-top:0; color:#10b981; font-size: 1.3em;"><i class="fas fa-check-double"></i> Marking AI Pro</h3>
            <textarea id="ai-marking-input" rows="8" class="form-control" style="margin-bottom:20px;" placeholder="Paste Student NEA/Coursework Submission here..."></textarea>
            <button type="button" class="btn-primary" style="width:100%; background:#10b981; padding: 12px;" id="btn-mark-gen" onclick="aistudioController.runAutoMarker()"><i class="fas fa-robot"></i> Analyze & Generate Feedback</button>
            <div id="ai-marking-output" style="margin-top:20px; background:var(--note-bg); padding:20px; border-radius:var(--radius-sm); font-size:0.95em; min-height:150px; border: 1px solid var(--border); line-height: 1.6;"></div>
        </div>

    </div>
</div>
