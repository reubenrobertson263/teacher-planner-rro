<style>
    .dash-headline{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 20px;border-radius:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,var(--card)),var(--card));border:1px solid var(--border);box-shadow:var(--shadow-sm)}
    .dash-headline h2{margin:0;font-size:1.55rem}.dash-headline p{margin:5px 0 0;color:var(--text-muted)}
    .dash-week-badge{min-width:112px;padding:10px 18px;border-radius:16px;background:var(--accent);color:#fff;text-align:center;box-shadow:var(--shadow-sm)}.dash-week-badge span{display:block;text-transform:uppercase;letter-spacing:.12em;font-size:.68rem;font-weight:800;opacity:.82}.dash-week-badge strong{display:block;font-size:2.15rem;line-height:1;margin-top:3px}
    .dash-date-subtitle{font-size:.58em;color:var(--text-muted);font-weight:500;margin-left:10px}
    .dash-lesson-card{display:grid;grid-template-columns:130px 1fr;background:var(--card);border:1px solid var(--border);border-left:7px solid var(--lesson-colour);border-radius:15px;overflow:hidden;box-shadow:var(--shadow-sm)}.dash-period-badge{padding:16px 14px;background:color-mix(in srgb,var(--lesson-colour) 9%,var(--surface));display:flex;flex-direction:column;justify-content:center}.dash-period-badge strong{font-size:1.08rem}.dash-period-badge span{font-size:.76rem;color:var(--text-muted);margin-top:4px}.dash-lesson-main{padding:15px 18px}.dash-lesson-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.dash-lesson-top h3{margin:0;font-size:1.15rem}.dash-lesson-top span,.dash-lesson-meta{color:var(--text-muted);font-size:.8rem}.dash-lesson-meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:9px}
    .dash-empty{padding:38px;text-align:center;background:var(--card);border:1px dashed var(--border);border-radius:16px;color:var(--text-muted);display:flex;flex-direction:column;align-items:center;gap:7px}.dash-empty strong{color:var(--text);font-size:1.05rem}
    @media(max-width:650px){.dash-headline{align-items:flex-start}.dash-week-badge{min-width:86px}.dash-lesson-card{grid-template-columns:1fr}.dash-period-badge{padding:10px 14px}.dash-lesson-top{align-items:flex-start;flex-direction:column}}
</style>
<div class="topbar">
    <div class="left-controls">
        <button type="button" class="mobile-menu-btn" onclick="app.toggleMenu()"><i class="fas fa-bars"></i></button>
        <button type="button" class="btn-icon" onclick="window.dashboardController.navigateDate(-1)"><i class="fas fa-chevron-left"></i></button>
        <button type="button" class="btn-icon" onclick="window.dashboardController.navigateDate(1)"><i class="fas fa-chevron-right"></i></button>
        <div class="date-title" id="today-header-title">Dashboard</div>
    </div>
</div>
<div class="scrollable-container">
    <div style="max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:24px;">
        <section class="dash-headline">
            <div><h2>Today at a glance</h2><p>Your hydrated timetable, ready without another timetable fetch.</p></div>
            <div id="dashboard-week-badge" class="dash-week-badge"><span>Week</span><strong>A</strong></div>
        </section>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:24px;">
            <div class="settings-card" style="text-align:center;">
                <h3 style="margin-top:0;color:var(--text-muted);font-size:1em;text-transform:uppercase;letter-spacing:1px;">Task Completion</h3>
                <div id="dash-task-ring" class="dash-stat-circle" style="background:conic-gradient(var(--accent) 0%,var(--border) 0);height:120px;width:120px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:2em;font-weight:bold;">0%</div>
            </div>
            <div class="settings-card" style="text-align:center;">
                <h3 style="margin-top:0;color:var(--text-muted);font-size:1em;text-transform:uppercase;letter-spacing:1px;">AI Time Saved</h3>
                <div style="height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;">
                    <div style="font-size:4em;color:#10b981;font-weight:900;line-height:1;" id="dash-hours-saved">0</div>
                    <div style="font-weight:600;color:var(--text-main);">Hours</div>
                </div>
            </div>
        </div>
        <h2 style="margin:10px 0 0;font-size:1.5em;letter-spacing:-.5px;">Today's Schedule</h2>
        <div id="today-timeline-container" style="display:flex;flex-direction:column;gap:12px;"></div>
    </div>
</div>
